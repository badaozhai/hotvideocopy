[project]
name = "hotvideocopy"
version = "0.1.0"
description = "爆款短视频解构与复刻 —— MCP 工具箱"
readme = "README.md"
# 3.14 上 opencv / torch 生态 wheel 覆盖还不全，锁在 3.11–3.13
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "scenedetect[opencv]>=0.6.4",
]

[project.scripts]
hotvideocopy = "hotvideocopy.server:main"

[project.optional-dependencies]
# 第一阶段 transcribe / 第二阶段 OCR 用，装起来重，单独拆开
asr = [
    "faster-whisper>=1.0",
    "demucs>=4.0",
    "pyannote.audio>=3.1",
    "librosa>=0.10",
]
ocr = [
    "rapidocr-onnxruntime>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotvideocopy"]
