<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写轮眼</title>
<style>
:root{
  --text:#3b4258; --dim:#8892ab; --accent:#5b8cff; --accent2:#a78bfa;
  --ok:#2fae7c; --warn:#e8963d; --line:rgba(120,140,190,.16);
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.62);
  --radius:16px;
  --shadow:0 8px 24px rgba(90,110,170,.10),0 2px 6px rgba(90,110,170,.07);
  --shadow-lift:0 12px 32px rgba(90,110,170,.16),0 4px 10px rgba(90,110,170,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  color:var(--text);font:14px/1.6 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 8% -10%,#d7ebff 0%,transparent 55%),
    radial-gradient(900px 620px at 102% -4%,#eadfff 0%,transparent 55%),
    radial-gradient(1000px 820px at 46% 112%,#d9f6e8 0%,transparent 60%),
    radial-gradient(720px 520px at 96% 88%,#ffe6f0 0%,transparent 55%),
    #f3f6fc;
  background-attachment:fixed;
}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 1px 16px rgba(90,110,170,.06)}
header h1{font-size:15px;font-weight:700;background:linear-gradient(100deg,#d6304c,#ff7a59);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
header button{margin-left:auto}
main{flex:1;display:flex;min-height:0}
aside{width:242px;flex-shrink:0;overflow-y:auto;
  background:rgba(255,255,255,.4);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border-right:1px solid rgba(255,255,255,.7)}
.proj{margin:8px 10px;padding:9px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.proj:hover{background:rgba(255,255,255,.6)}
.proj.active{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9);box-shadow:var(--shadow)}
.proj .name{font-weight:600;font-size:13px;word-break:break-all}
.proj .info{color:var(--dim);font-size:11px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.5)}
.badge.on{color:var(--ok);border-color:rgba(47,174,124,.4);background:rgba(47,174,124,.08)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
nav{display:flex;gap:6px;padding:10px 18px;
  background:rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.65)}
nav button{background:none;border:none;color:var(--dim);font-size:13px;padding:6px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
nav button:hover{color:var(--text);background:rgba(255,255,255,.5)}
nav button.active{background:rgba(255,255,255,.92);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
#content{flex:1;overflow-y:auto;padding:20px}
.empty{color:var(--dim);text-align:center;margin-top:18vh;font-size:13px}
button.btn{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85);color:var(--text);
  padding:6px 16px;border-radius:999px;cursor:pointer;font-size:12px;box-shadow:var(--shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .15s}
button.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift);color:var(--accent)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.meta-item{background:var(--glass2);border:1px solid rgba(255,255,255,.8);border-radius:var(--radius);
  padding:10px 14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.meta-item .k{color:var(--dim);font-size:11px}
.meta-item .v{font-size:13px;word-break:break-all;margin-top:2px;user-select:text}
.players{display:flex;gap:20px;flex-wrap:wrap}
.player h3{font-size:13px;color:var(--dim);margin-bottom:8px}
video.main{max-height:60vh;max-width:340px;border-radius:var(--radius);background:#000;
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow-lift)}
.rhythm{display:flex;height:28px;border-radius:999px;overflow:hidden;margin-bottom:18px;
  border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);background:rgba(255,255,255,.5)}
.rhythm div{cursor:pointer;border-right:1px solid rgba(255,255,255,.7);min-width:2px;transition:filter .1s}
.rhythm div:hover{filter:brightness(.88) saturate(1.4)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.shot{background:var(--glass2);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .15s}
.shot:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.shot .thumb{aspect-ratio:9/16;max-height:280px;width:100%;object-fit:contain;background:linear-gradient(160deg,#e8eefb,#dde6f7);display:block;cursor:zoom-in}
.shot .body{padding:9px 12px}
.shot .head{display:flex;justify-content:space-between;align-items:baseline}
.shot .idx{font-weight:700;color:var(--accent)}
.shot .tt{color:var(--dim);font-size:11px}
.shot .dur{color:var(--warn);font-size:11px;font-weight:600}
.line{font-size:12px;margin-top:5px;padding-left:8px;border-left:2px solid var(--accent);user-select:text}
.line.ocr{border-color:var(--accent2);color:#7c66c9}
.line .spk{color:var(--ok);font-size:11px;margin-right:4px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols h3{font-size:13px;color:var(--dim);margin-bottom:10px}
.cols>div{background:var(--glass2);border:1px solid rgba(255,255,255,.8);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg{display:flex;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;user-select:text}
.seg .ts{color:var(--dim);font-size:11px;white-space:nowrap;min-width:86px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.gallery img{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.85);cursor:zoom-in;display:block;box-shadow:var(--shadow);transition:all .15s}
.gallery img:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-lift)}
.gallery video{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.85);background:#000;box-shadow:var(--shadow)}
.gallery .cap{font-size:11px;color:var(--dim);word-break:break-all;margin-top:4px}
h2.sec{font-size:14px;margin:4px 0 12px}
audio{width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
pre#json{background:var(--glass2);border:1px solid rgba(255,255,255,.8);border-radius:var(--radius);
  padding:16px;font:12px/1.5 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;
  user-select:text;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#lightbox{position:fixed;inset:0;background:rgba(235,241,252,.55);backdrop-filter:blur(28px) saturate(1.4);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:16px;box-shadow:0 24px 64px rgba(60,80,140,.3)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,140,190,.3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,140,190,.5)}
</style>
</head>
<body>
<header>
  <h1>写轮眼</h1>
  <span class="sub">爆款短视频解构与复刻 · 工作区查看器</span>
  <button class="btn" onclick="loadProjects()">刷新</button>
</header>
<main>
  <aside id="projects"></aside>
  <section>
    <nav id="tabs" style="display:none">
      <button data-tab="overview" class="active">概览</button>
      <button data-tab="shots">分镜</button>
      <button data-tab="words">台词·花字</button>
      <button data-tab="gen">生成素材</button>
      <button data-tab="files">工程文件</button>
    </nav>
    <div id="content"><div class="empty">← 选择一个项目</div></div>
  </section>
</main>
<div id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img" alt=""></div>

<script>
let cur = null, detail = null, tab = 'overview';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = t => { t = +t || 0; const m = Math.floor(t / 60); return m + ':' + (t % 60).toFixed(1).padStart(4, '0'); };

async function loadProjects() {
  const list = await (await fetch('/api/projects')).json();
  $('#projects').innerHTML = list.length ? list.map(p => `
    <div class="proj ${p.id === cur ? 'active' : ''}" onclick="openProject('${esc(p.id)}')">
      <div class="name">${esc(p.id)}</div>
      ${p.title ? `<div class="info">${esc(p.title.slice(0, 40))}</div>` : ''}
      <div class="info">
        ${p.duration ? `<span>${fmtT(p.duration)}</span>` : ''}
        ${p.shot_count ? `<span>${p.shot_count} 镜</span>` : ''}
        <span class="badge ${p.has_source ? 'on' : ''}">源</span>
        <span class="badge ${p.has_output ? 'on' : ''}">成片</span>
      </div>
    </div>`).join('') : '<div class="empty" style="margin-top:40px">workspace 为空</div>';
}

async function openProject(pid) {
  cur = pid;
  detail = await (await fetch('/api/project/' + encodeURIComponent(pid))).json();
  $('#tabs').style.display = 'flex';
  document.querySelectorAll('.proj').forEach(el =>
    el.classList.toggle('active', el.querySelector('.name').textContent === pid));
  render(tab);
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  render(tab = b.dataset.tab);
});

function render(t) {
  if (!detail) return;
  ({overview: rOverview, shots: rShots, words: rWords, gen: rGen, files: rFiles})[t]();
}

// ── 概览 ──
function rOverview() {
  const m = detail.meta || {};
  const rows = Object.entries(m).filter(([, v]) => typeof v !== 'object').slice(0, 16);
  $('#content').innerHTML = `
    <div class="meta-grid">${rows.map(([k, v]) =>
      `<div class="meta-item"><div class="k">${esc(k)}</div><div class="v">${esc(String(v).slice(0, 120))}</div></div>`).join('')
    }</div>
    <div class="players">
      ${detail.has_source ? player('源片 source.mp4', 'source.mp4') : ''}
      ${detail.has_output ? player('成片 output.mp4', 'output.mp4') : ''}
    </div>`;
}
const player = (title, file) => `
  <div class="player"><h3>${title}</h3>
  <video class="main" id="v-${file.split('.')[0]}" src="/media/${encodeURIComponent(cur)}/${file}" controls preload="metadata"></video></div>`;

// ── 分镜 ──
const inRange = (seg, st, en) => seg.t && seg.t[0] < en && seg.t[1] > st;
function rShots() {
  const sh = (detail.shots || {}).shots || [];
  if (!sh.length) { $('#content').innerHTML = '<div class="empty">还没有 shots.json——先跑 scene_split</div>'; return; }
  const total = sh.reduce((a, s) => a + s.duration, 0);
  const segs = (detail.transcript.segments || []);
  const spans = (detail.ocr.spans || []);
  const hue = i => 210 + (i * 47) % 120;
  $('#content').innerHTML = `
    <div class="rhythm">${sh.map(s =>
      `<div style="width:${(s.duration / total * 100).toFixed(2)}%;background:hsl(${hue(s.idx)} 75% 80%)"
        title="#${s.idx} ${s.duration}s" onclick="seek(${s.t[0]})"></div>`).join('')}</div>
    <div class="shots">${sh.map(s => {
      const mid = s.sample_ts ? s.sample_ts[1] : (s.t[0] + s.t[1]) / 2;
      const lines = segs.filter(x => inRange(x, s.t[0], s.t[1])).map(x =>
        `<div class="line">${x.spk ? `<span class="spk">${esc(x.spk)}</span>` : ''}${esc(x.text)}</div>`).join('');
      const texts = spans.filter(x => inRange(x, s.t[0], s.t[1])).map(x =>
        `<div class="line ocr">${esc(x.text)}</div>`).join('');
      return `<div class="shot">
        <img class="thumb" loading="lazy" data-t="${mid}" alt="#${s.idx}"
          onclick="zoomFrame(${mid})">
        <div class="body">
          <div class="head"><span class="idx">#${s.idx}</span>
            <span class="tt" style="cursor:pointer" onclick="seek(${s.t[0]})">${fmtT(s.t[0])} → ${fmtT(s.t[1])}</span>
            <span class="dur">${s.duration}s</span></div>
          ${lines}${texts}
        </div></div>`;
    }).join('')}</div>`;
  // 懒加载缩略图:进视口才抽帧
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    e.target.src = `/api/project/${encodeURIComponent(cur)}/frame?t=${e.target.dataset.t}&w=320`;
  }), {rootMargin: '400px'});
  document.querySelectorAll('.thumb[data-t]').forEach(el => io.observe(el));
}
function zoomFrame(t) {
  $('#lightbox-img').src = `/api/project/${encodeURIComponent(cur)}/frame?t=${t}&w=1080`;
  $('#lightbox').style.display = 'flex';
}
function seek(t) {
  document.querySelector('#tabs button[data-tab=overview]').click();
  const v = $('#v-source') || $('#v-output');
  if (v) { v.currentTime = t; v.play(); }
}

// ── 台词·花字 ──
function rWords() {
  const segs = detail.transcript.segments || [], spans = detail.ocr.spans || [];
  const seg = x => `<div class="seg"><span class="ts">${fmtT(x.t[0])}–${fmtT(x.t[1])}</span>
    <span>${x.spk ? `<span class="spk">${esc(x.spk)} </span>` : ''}${esc(x.text)}</span></div>`;
  $('#content').innerHTML = `<div class="cols">
    <div><h3>台词 transcript.json(${segs.length} 段)</h3>${segs.map(seg).join('') || '<div class="empty">无</div>'}</div>
    <div><h3>花字/字幕 ocr.json(${spans.length} 条)</h3>${spans.map(x => `
      <div class="seg"><span class="ts">${fmtT(x.t[0])}–${fmtT(x.t[1])}</span>
      <span>${esc(x.text)} <span class="ts">y=${x.y}</span></span></div>`).join('') || '<div class="empty">无</div>'}</div>
  </div>`;
}

// ── 生成素材 ──
function rGen() {
  const media = f => `/media/${encodeURIComponent(cur)}/${f.split('/').map(encodeURIComponent).join('/')}`;
  const imgs = detail.gen_images, clips = detail.gen_clips, tts = detail.gen_tts;
  if (!imgs.length && !clips.length && !tts.length) {
    $('#content').innerHTML = '<div class="empty">gen/ 目录为空——还没跑生成</div>'; return;
  }
  $('#content').innerHTML = `
    ${imgs.length ? `<h2 class="sec">首帧 / 定妆图(${imgs.length})</h2><div class="gallery">${imgs.map(f => `
      <div><img loading="lazy" src="${media(f)}" onclick="$('#lightbox-img').src=this.src;$('#lightbox').style.display='flex'">
      <div class="cap">${esc(f.split('/').pop())}</div></div>`).join('')}</div>` : ''}
    ${clips.length ? `<h2 class="sec">视频片段(${clips.length})</h2><div class="gallery">${clips.map(f => `
      <div><video src="${media(f)}" controls preload="metadata"></video>
      <div class="cap">${esc(f.split('/').pop())}</div></div>`).join('')}</div>` : ''}
    ${tts.length ? `<h2 class="sec">TTS(${tts.length})</h2>${tts.map(f => `
      <div style="margin-bottom:8px"><div class="cap">${esc(f.split('/').pop())}</div>
      <audio src="${media(f)}" controls preload="none"></audio></div>`).join('')}` : ''}`;
}

// ── 工程文件 ──
function rFiles() {
  const avail = Object.entries(detail.json_files).filter(([, v]) => v).map(([k]) => k);
  $('#content').innerHTML = `
    <div class="chips">${avail.map(n =>
      `<button class="btn" onclick="showJson('${n}',this)">${n}.json</button>`).join('') || '<div class="empty">无工程 JSON</div>'}</div>
    <pre id="json"></pre>`;
  if (avail.length) showJson(avail[0], document.querySelector('.chips .btn'));
}
async function showJson(name, btn) {
  document.querySelectorAll('.chips .btn').forEach(b => b.style.borderColor = '');
  if (btn) btn.style.borderColor = 'var(--accent)';
  const r = await fetch(`/api/project/${encodeURIComponent(cur)}/json/${name}`);
  const text = await r.text();
  try { $('#json').textContent = JSON.stringify(JSON.parse(text), null, 2); }
  catch { $('#json').textContent = text; }
}

loadProjects();
</script>
</body>
</html>
